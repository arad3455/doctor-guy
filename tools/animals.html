<!doctype html>
<html><head><meta charset="utf-8"><title>Zoo animals</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body>
<script type="module">
// tools/animals.html?yaw=<deg>: the hand-built zoo animals in a row (src/zooAnimals.js), for checking how they look
import * as THREE from 'three';
import { makeCapybara, makeFlamingo, makeTortoise, makeMeerkat, makeDuck, makeZebra, makeHippo, makeParrot } from '../src/zooAnimals.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.add(new THREE.HemisphereLight(0xdff2ff, 0x6cc24a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(3, 6, 5); sun.castShadow = true;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshToonMaterial({ color: 0x6cc24a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
const list = [makeCapybara(), makeCapybara({ mandarin: true, tone: 0.04 }), makeFlamingo(), makeTortoise(), makeMeerkat(), makeZebra(), makeHippo(), makeParrot(0), makeParrot(1), makeDuck()];
const yaw = THREE.MathUtils.degToRad(Number(q.get('yaw') ?? 35));
const xs = [-5.6, -4.3, -3, -1.6, -0.5, 0.9, 3.3, 5.1, 5.6, 6.2];
list.forEach((a, i) => { a.root.position.set(xs[i], 0, 0); a.root.rotation.y = yaw; scene.add(a.root); });
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0.3, 2.6, 11); cam.lookAt(0.3, 0.8, 0);
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
