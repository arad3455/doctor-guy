<!doctype html>
<html><head><meta charset="utf-8"><title>Character viewer</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body>
<script type="module">
// tools/viewer.html?char=doctor|<kidLook>&view=head|full&yaw=<deg>&pose=idle|walk|run|carrying
import * as THREE from 'three';
import { buildDoctor, buildKid, animateRig } from '../src/characters.js';
import { loadDoctorModel } from '../src/doctorModel.js';
import { preloadKids } from '../src/kidModels.js';
await preloadKids();
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.add(new THREE.HemisphereLight(0xdff2ff, 0x6cc24a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(3, 6, 5);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 32), new THREE.MeshToonMaterial({ color: 0x6cc24a }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const ch = q.get('char') ?? 'doctor';
const rig = ch === 'generated' ? await loadDoctorModel() : ch === 'doctor' ? buildDoctor() : buildKid(ch);
scene.add(rig.root);
if (q.has('tears') && rig.tears) rig.tears.visible = true;
if (q.has('cast') && rig.cast) rig.cast.visible = true;
if (q.has('nohair')) rig.root.traverse((o) => { if (o.geometry?.type === 'ConeGeometry') o.visible = false; });
const yaw = THREE.MathUtils.degToRad(+(q.get('yaw') ?? 0));
const head = q.get('view') === 'head';
const box = new THREE.Box3().setFromObject(rig.root);
const H = box.max.y;
rig.root.updateMatrixWorld(true);
const headPos = rig.head ? rig.head.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3();
const target = new THREE.Vector3(0, head ? (ch === 'generated' ? H * 0.82 : rig.generated ? H * 0.75 : headPos.y + (ch === 'doctor' ? 0.52 : 0.3)) : H * 0.5, 0);
const dist = head ? (ch === 'doctor' || ch === 'generated' ? 2.1 : 1.1) : H * 1.45;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
cam.position.set(Math.sin(yaw) * dist, target.y + (head ? 0.02 : 0.1), Math.cos(yaw) * dist);
cam.lookAt(target);
const pose = q.get('pose') ?? 'idle';
let t = 0;
(function loop() {
  t += 1 / 60;
  animateRig(rig, pose, t, 1 / 60, pose === 'run' ? 8 : pose === 'walk' ? 4 : 0);
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
})();
window.__rig = rig;
window.ready = true;
</script></body></html>
