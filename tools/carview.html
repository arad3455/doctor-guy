<!doctype html>
<html><head><meta charset="utf-8"><title>Car viewer</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dde3ea}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body>
<script type="module">
// tools/carview.html?src=../assets/props/carSuper.glb&yaw=40 — one model, lit like a studio, for checking Meshy output
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xdde3ea);
s.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(4, 6, 5); s.add(d);
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const g = await l.loadAsync(q.get('src'));
const box = new THREE.Box3().setFromObject(g.scene); const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
g.scene.position.sub(c);
const holder = new THREE.Group(); holder.add(g.scene); holder.rotation.y = THREE.MathUtils.degToRad(Number(q.get('yaw') ?? 0)); s.add(holder);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100); const m = Math.max(sz.x, sz.y, sz.z);
cam.position.set(m * 1.1, m * 0.55, m * 1.3); cam.lookAt(0, 0, 0); r.render(s, cam); window.__done = [sz.x, sz.y, sz.z].map((v) => +v.toFixed(2));
</script></body></html>
